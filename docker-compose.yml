services:

  # ─── PHP-FPM 8.3 (Laravel) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: 4psi_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/Dockerfile:/var/www/docker/php/Dockerfile:ro
    environment:
      - PHP_OPCACHE_ENABLE=1
    networks:
      - 4psi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Limites para rodar liso no ultrabook
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: 4psi_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - 4psi_network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── MySQL 8 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: 4psi_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-4psi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: ${DB_USERNAME:-4psi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-4psi_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - 4psi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: 4psi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - 4psi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  # ─── MailHog (emails de dev sem envio real) ──────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: 4psi_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI Web
    networks:
      - 4psi_network
    deploy:
      resources:
        limits:
          memory: 32M

# ─── Volumes persistentes ────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ─── Rede interna ────────────────────────────────────────────────────────────
networks:
  4psi_network:
    driver: bridge
